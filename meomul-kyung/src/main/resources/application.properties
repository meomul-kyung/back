spring.application.name=meomul-kyung

# ===== DataSource (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE:meomulkyung}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:meomul}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver